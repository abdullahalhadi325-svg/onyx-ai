name: Build Onyx Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android NDK & CMake
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Clone llama.cpp if missing
        run: |
          if [ ! -d "android/app/src/main/cpp/llama.cpp" ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git android/app/src/main/cpp/llama.cpp
          fi
      - name: Build Web, Generate Icons & Sync Capacitor
        env:
          VITE_BACKEND_API_URL: https://hadi-mp-ai-backend.abdullahalhadi325.workers.dev
          VITE_SUPABASE_URL: https://gtzqnemrppyvnbdeoeke.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID }}
          VITE_ADMIN_PIN: ${{ secrets.VITE_ADMIN_PIN }}
        run: |
          npm install --legacy-peer-deps
          if [ -f "icon.png" ]; then
            mkdir -p assets && cp icon.png assets/icon.png
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#000000'
          fi
          npm run build
          npx cap sync android
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Onyx-AI-OS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
